services:
  booking_backend:
    image: booking_api:latest
    networks:
      - my_network
    volumes:
      - shared_images:/app/src/static/images
    command: sh -c "alembic upgrade head && python -m src.main"

  booking_cache_redis:
    image: redis:8.2.2
    networks:
      - my_network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  booking_celery_worker:
    image: booking_api:latest
    networks:
      - my_network
    user: "1000:1000"
    depends_on:
      - booking_backend
      - booking_cache_redis
    volumes:
      - shared_images:/app/src/static/images
    command: celery --app=src.tasks.celery_base:celery_app worker --loglevel=INFO

  booking_celery_beat:
    image: booking_api:latest
    networks:
      - my_network
    user: "1000:1000"
    depends_on:
      - booking_backend
      - booking_celery_worker
      - booking_cache_redis
    command: celery --app=src.tasks.celery_base:celery_app beat -l INFO

volumes:
  shared_images:
  redis_data:

networks:
  my_network:
    external: true