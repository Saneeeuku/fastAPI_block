services:
  backend:
    container_name: booking_backend
    image: booking_api:latest
    networks:
      - my_network
    volumes:
      - shared_images:/app/src/static/images
    command: sh -c "alembic upgrade head && python -m src.main"

  cache:
    container_name: booking_cache_redis
    image: redis:8.2.2
    networks:
      - my_network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  celery_worker:
    container_name: booking_celery_worker
    image: booking_api:latest
    networks:
      - my_network
    user: "1000:1000"
    depends_on:
      - backend
      - cache
    volumes:
      - shared_images:/app/src/static/images
    command: celery --app=src.tasks.celery_base:celery_app worker --loglevel=INFO

  celery_beat:
    container_name: booking_celery_beat
    image: booking_api:latest
    networks:
      - my_network
    user: "1000:1000"
    depends_on:
      - backend
      - celery_worker
      - cache
    command: celery --app=src.tasks.celery_base:celery_app beat -l INFO

volumes:
  shared_images:
  redis_data:

networks:
  my_network:
    external: true