stages:
  - build
#  - test
  - deploy

build-job:
  stage: build
  before_script:
    - cp ${ENV} .env
    - cp ${ENV_TEST} .env_test
  script:
    - echo "Compiling the code..."
    - docker build -t booking_api_image .
    - echo "Compile complete."

