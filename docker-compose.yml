services:
  backend:
    container_name: booking_backend
    build:
      context: .
      dockerfile: Dockerfile
    # ports:
    #   - "8000:8000"
    networks:
      - my_network
    env_file:
      - ".env"
    volumes:
      - shared_images:/app/src/static/images
    command: sh -c "python -m src.main"

  cache:
    container_name: booking_cache_redis
    image: redis:8.2.2
    # ports:
    #   - "7379:6379"
    networks:
      - my_network
    env_file:
      - ".env"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  celery_worker:
    container_name: booking_celery_worker
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - my_network
    env_file:
      - ".env"
    user: "1000:1000"
    depends_on:
      - backend
      - cache
    volumes:
      - shared_images:/app/src/static/images
    command: celery --app=src.tasks.celery_base:celery_app worker --loglevel=INFO

  celery_beat:
    container_name: booking_celery_beat
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - my_network
    env_file:
      - ".env"
    user: "1000:1000"
    depends_on:
      - backend
      - celery_worker
      - cache
    command: celery --app=src.tasks.celery_base:celery_app beat -l INFO

volumes:
  shared_images:
  redis_data:

networks:
  my_network:
    external: true